; ──────────────────────────────────────────────────────────────────────────
; php-fpm pool override for Laravel production. Loaded after www.conf, so
; settings here win. The pool name stays [www] to override the default pool.
; ──────────────────────────────────────────────────────────────────────────

[global]
; Send the master/error log to the container's stderr so `docker logs` works.
error_log = /proc/self/fd/2
; Don't daemonize — required for running as the container's foreground process.
daemonize = no

[www]
; NOTE: user/group are intentionally NOT set here. The container runs as the
; non-root `www` user via the image's USER directive, so php-fpm already runs
; (master + workers) as www. Setting user/group while not running as root makes
; php-fpm refuse to start ("must be launched as root" for setuid). Leaving them
; unset is the correct pattern for a rootless FPM image.

; Listen on TCP so an upstream nginx/apache in another container can reach us.
listen = 0.0.0.0:9000

; Worker process management. `dynamic` suits typical web traffic; tune via env
; in downstream images if needed.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Surface worker stdout/stderr (e.g. error_log = /dev/stderr) to docker logs.
catch_workers_output = yes
decorate_workers_output = no

; Built-in ping endpoint used by the image HEALTHCHECK. Returns "pong".
ping.path = /ping
ping.response = pong

; Status page (handy for metrics / debugging via fastcgi on /status).
pm.status_path = /status

; Pass server-side env through to PHP (Laravel reads many of these).
clear_env = no
