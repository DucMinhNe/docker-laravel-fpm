; ──────────────────────────────────────────────────────────────────────────
; Production php.ini overrides tuned for Laravel.
; Filename prefixed `zz-` so it loads last and wins over earlier conf.d files.
; ──────────────────────────────────────────────────────────────────────────

; Memory: Laravel + Composer autoload + queue workers want headroom.
memory_limit = 256M

; Request lifetime (web requests via FPM; CLI/queues are unlimited separately).
max_execution_time = 60
max_input_time = 60

; Uploads — generous defaults for typical app file handling.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 50

; Errors: log, never leak to the response in production.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /dev/stderr

; Sane locale/encoding for Laravel.
default_charset = "UTF-8"
date.timezone = UTC

; Realpath cache speeds up autoloading of many small class files.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; Don't advertise the PHP version in headers.
expose_php = Off
