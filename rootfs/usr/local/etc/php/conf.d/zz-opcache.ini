; ──────────────────────────────────────────────────────────────────────────
; OPcache — production settings. The opcache extension itself is enabled by the
; generated docker-php-ext-opcache.ini; this file only tunes it.
; ──────────────────────────────────────────────────────────────────────────

opcache.enable = 1
opcache.enable_cli = 0

; Memory for compiled bytecode. 192M comfortably holds a large Laravel app.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; Laravel has many files (framework + vendor); raise the file slot ceiling.
opcache.max_accelerated_files = 20000

; Production: code is immutable inside the image, so never stat files for
; changes. (Set opcache.validate_timestamps=1 + revalidate_freq for dev.)
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Faster shutdown, drop comments we don't need at runtime (keep for annotations
; libs? Laravel core doesn't rely on doc-comment reflection by default).
opcache.save_comments = 1
opcache.fast_shutdown = 1

; JIT — tracing mode, modest buffer. Helps CPU-bound paths.
opcache.jit = tracing
opcache.jit_buffer_size = 64M
