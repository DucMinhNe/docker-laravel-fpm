# Example production-ish stack: Laravel (php-fpm) + nginx + mysql + redis.
# Drop this in your Laravel project root and run `docker compose up --build`.

services:
  # PHP-FPM app, built FROM the laravel-fpm base image (see Dockerfile.app).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-laravel-app:latest
    restart: unless-stopped
    # The base image already runs as non-root `www`, exposes 9000 and ships a
    # php-fpm HEALTHCHECK — nothing extra needed here.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      # Share the app code with nginx so it can serve static files from public/.
      - app-code:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # nginx terminates HTTP and proxies *.php to the app container on :9000.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./examples/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code:/var/www/html:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  app-code:
  db-data:
