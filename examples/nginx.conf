# Example nginx server block for a Laravel app served by the laravel-fpm image.
# Mount at /etc/nginx/conf.d/default.conf in your nginx container.
# `app` is the service name of the php-fpm container in docker-compose.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Max upload — keep in sync with the base image's php.ini (upload_max_filesize).
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # `app:9000` -> php-fpm container. Change `app` to your service name.
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Don't expose dotfiles (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
